<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Campus Map</title>
<link rel="stylesheet" href="leaflet.css" />
<style>
    body { margin: 0; padding: 0; }
    #map { width: 100%; height: 100vh; }
    .building-popup .popup-name { font-weight: bold; font-size: 14px; }
    .building-popup .popup-category { font-size: 12px; color: #666; }
</style>
</head>
<body>
<div id="map"></div>
<script src="leaflet.js"></script>
<script>
    var map = L.map('map', {
        center: [34.3740, 108.9100],
        zoom: 15,
        zoomControl: true
    });

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    var markers = {};
    var selectedMarker = null;

    function addBuilding(id, name, lat, lng, category, color) {
        var catNames = {
            'TEACHING': '教学楼', 'CANTEEN': '餐厅', 'LIBRARY': '图书馆',
            'DORM': '宿舍', 'OTHER': '其他'
        };
        var icon = L.divIcon({
            className: 'custom-marker',
            html: '<div style="background:' + color + ';width:16px;height:16px;border-radius:50%;border:3px solid white;box-shadow:0 1px 4px rgba(0,0,0,0.4);"></div>',
            iconSize: [22, 22],
            iconAnchor: [11, 11],
            popupAnchor: [0, -11]
        });
        var marker = L.marker([lat, lng], {icon: icon}).addTo(map);
        marker.bindPopup(
            '<div class="building-popup">' +
            '<div class="popup-name">' + name + '</div>' +
            '<div class="popup-category">' + catNames[category] + '</div></div>'
        );
        (function(bid) {
            marker.on('click', function() {
                if (window.javaBridge) window.javaBridge.onBuildingSelected(bid);
            });
        })(id);
        markers[id] = marker;
    }

    function selectBuilding(id) {
        if (selectedMarker) selectedMarker.closePopup();
        if (markers[id]) {
            selectedMarker = markers[id];
            selectedMarker.openPopup();
            map.setView(selectedMarker.getLatLng(), map.getZoom(), {animate: true});
        }
    }
</script>
</body>
</html>
